<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103b39"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; manifest-src 'self'; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><title>Casa in Ordine — Gestione familiare</title><link rel="stylesheet" href="./style.css"><link rel="manifest" href="./manifest.webmanifest"><script type="module" src="./app.js"></script></head><body><div class="trial-banner">Casa in Ordine · Archivio personale cifrato</div><div id="status" role="status" aria-live="polite">Avvio sicuro…</div><main id="gate" class="gate panel"></main><div id="app" hidden></div><template id="appTemplate"><div class="layout"><aside class="side"><div class="brand"><span class="logo">⌂</span> Casa in Ordine</div><nav class="nav" id="desktopnav"><button data-tab="dashboard" class="active">▦ &nbsp; Panoramica</button><button data-tab="movimenti">↔ &nbsp; Entrate e uscite</button><button data-tab="scadenze">◷ &nbsp; Scadenze</button><button data-tab="fisco">▤ &nbsp; Fisco</button><button data-tab="documenti">▣ &nbsp; DOCUMENTI</button><button data-tab="impostazioni">⚙ &nbsp; Dati e backup</button></nav><div class="foot">Archivio personale cifrato.<br>Nessuna sincronizzazione online.<br><button class="btn secondary" id="lockDesktop">Blocca adesso</button></div></aside><main class="main"><div class="security-actions"><button class="btn secondary" id="lockNow">🔒 Blocca</button></div><header class="top"><div><div class="eyebrow">GESTIONE FAMILIARE</div><h1 id="pageTitle">Panoramica</h1><p class="subtitle" id="pageSub">Il controllo delle spese, in un unico posto.</p></div><button class="btn" id="topAdd">+ Nuovo movimento</button></header>
<section class="section active" id="dashboard"><div class="toolbar"><div class="monthnav"><button id="prevMonth" aria-label="Mese precedente">‹</button><span id="monthLabel"></span><button id="nextMonth" aria-label="Mese successivo">›</button></div></div><p id="homeDocuments" class="notice"></p><div class="cards"><div class="card"><div class="label">Entrate del mese</div><div class="value green" id="incomeTotal">€0,00</div></div><div class="card"><div class="label">Uscite del mese</div><div class="value red" id="expenseTotal">€0,00</div></div><div class="card"><div class="label">Saldo del mese</div><div class="value" id="balanceTotal">€0,00</div></div></div><div class="grid2"><div class="panel"><h2>Spese per categoria</h2><div id="categoriesChart"></div></div><div class="panel"><div class="panelhead"><h2>Ultimi movimenti</h2><button class="btn secondary small" data-tab="movimenti">Vedi tutti</button></div><div id="recentList" class="list"></div></div></div><div class="panel" style="margin-top:14px"><div class="panelhead"><h2>Scadenze da ricordare</h2><button class="btn secondary small" data-tab="scadenze">Apri scadenze</button></div><div id="upcomingList"></div></div></section>
<section class="section" id="movimenti"><div class="toolbar"><input class="input grow" id="searchMovement" placeholder="Cerca una descrizione…"><select id="filterType"><option value="all">Tutti i movimenti</option><option value="expense">Solo uscite</option><option value="income">Solo entrate</option></select><button class="btn" id="addMovement">+ Aggiungi</button></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>Data</th><th>Descrizione</th><th>Categoria</th><th>Tipologia</th><th>Importo</th><th>Azioni</th></tr></thead><tbody id="movementsRows"></tbody></table></div></div></section>
<section class="section" id="scadenze"><div class="toolbar"><p class="hint grow">Registra pagamenti, controlli e promemoria. Non vengono inviate notifiche automatiche.</p><button class="btn" id="addDeadline">+ Nuova scadenza</button></div><div class="panel"><div id="deadlineList"></div></div></section>
<section class="section" id="fisco">
<div class="notice"><strong>Fisco Italia e Svizzera.</strong> Registro personale per importi, stati e scadenze. Non presenta dichiarazioni e non calcola automaticamente imposte o sanzioni. I dati sono conservati solo in questo browser: non caricare codici fiscali completi o documenti riservati.</div>
<div class="toolbar"><select id="taxYearFilter" aria-label="Filtra anno"><option value="all">Tutti gli anni</option></select><select id="taxCountryFilter" aria-label="Filtra paese"><option value="all">Italia e Svizzera</option><option value="IT">Italia</option><option value="CH">Svizzera</option></select><button class="btn" id="addTaxRecord">+ Nuova voce fiscale</button></div>
<div class="cards"><div class="card"><div class="label">Importi dovuti registrati (€)</div><div class="value" id="taxDueTotal">€0,00</div></div><div class="card"><div class="label">Importi versati registrati (€)</div><div class="value green" id="taxPaidTotal">€0,00</div></div><div class="card"><div class="label">Differenza registrata (€)</div><div class="value red" id="taxRemainingTotal">€0,00</div></div></div>
<div class="panel"><div class="panelhead"><h2>Le tue voci fiscali</h2></div><div id="taxRecordList" class="list"></div></div>
<div class="panel" style="margin-top:14px"><div class="panelhead"><h2>Sottovoci personalizzabili</h2><button class="btn small secondary" id="addTaxCategory">+ Crea sottovoce</button></div><p class="hint">Aggiungi sottovoci a qualsiasi categoria. Puoi modificarle o eliminarle in seguito. Le registrazioni già associate conservano il nome originario.</p><div id="taxCategoryList"></div></div>
</section>
<section class="section" id="documenti"><div class="panel"><h2>DOCUMENTI</h2><p class="hint">Riconoscimento sul dispositivo. Ogni proposta va verificata. Un importo dovuto non è un pagamento.</p><div class="toolbar"><button class="btn" id="uploadDocument">Carica documento</button><button class="btn secondary" id="manageFolders">Cartelle</button><button class="btn secondary" id="prepareOffline">Prepara riconoscimento offline</button><input class="input" id="documentSearch" placeholder="Cerca titolo, mittente, testo…" aria-label="Cerca documenti"><select id="documentFolderFilter" aria-label="Cartella documenti"></select></div><p class="hint" id="documentSpace"></p><p class="hint">Massimo 8 MB per file e 20 MB di originali complessivi in questa versione. PDF e immagini: anteprima e riconoscimento; altri file: archivio e download dopo sblocco.</p><div id="documentList"></div></div></section><section class="section" id="impostazioni"><div class="panel"><h2>Archivio personale cifrato</h2><p class="hint">Password e chiavi non vengono salvate in chiaro. Blocco dopo 10 minuti dall’ultima attività, anche in background. Il blocco manuale è immediato.</p><div class="security-actions"><button class="btn" id="exportBackup">Esporta backup cifrato</button><button class="btn secondary" id="importBackup">Importa backup cifrato</button><button class="btn secondary" id="exportPrevious">Esporta versione precedente cifrata</button><button class="btn secondary" id="persistentStorage">Richiedi conservazione locale</button></div><label>Seleziona un backup cifrato<input type="file" id="importFile" accept=".casa,application/json" hidden></label><p class="hint">Il backup si apre con la password valida al momento dell’esportazione o con la sua chiave di emergenza. Conservalo anche fuori dal telefono. La cancellazione dei dati del browser può eliminare l’archivio.</p><form id="passwordChangeForm"><h2>Cambia password</h2><label>Password attuale<input class="input" id="oldPassword" type="password" autocomplete="current-password" required></label><label>Nuova password<input class="input" id="changeNewPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><label>Ripeti nuova password<input class="input" id="changeRepeat" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><button class="btn" type="submit">Cambia password</button><p class="hint">La chiave di emergenza resta valida. I backup precedenti mantengono la password della loro creazione.</p></form><form id="csvForm"><h2>Esporta movimenti in CSV cifrato</h2><label>Password del file (almeno 12 caratteri)<input id="csvPassword" class="input" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><button class="btn secondary" type="submit">Esporta CSV cifrato</button></form><button class="btn secondary" id="readCsv">Leggi CSV cifrato</button><input type="file" id="csvFile" accept=".casa,application/json" hidden><p class="hint">Il CSV rimane cifrato: non si apre direttamente in Excel. Puoi leggerlo qui dopo aver inserito la password del file.</p></div></section><div class="footer-small">Casa in Ordine · versione 3 · Archivio cifrato · Tutti gli importi sono in euro (EUR)</div></main></div><nav class="mobilebar" id="mobilenav"><button class="active" data-tab="dashboard">▦<br>Home</button><button data-tab="movimenti">↔<br>Movimenti</button><button data-tab="scadenze">◷<br>Scadenze</button><button data-tab="fisco">▤<br>Fisco</button><button data-tab="documenti">▣<br>Documenti</button><button data-tab="impostazioni">⚙<br>Backup</button></nav>
<dialog id="movementDialog"><form class="modal" id="movementForm"><h2 id="movementDialogTitle">Nuovo movimento</h2><div class="fields"><div class="field"><label for="mType">Tipo</label><select id="mType"><option value="expense">Uscita</option><option value="income">Entrata</option></select></div><div class="field"><label for="mAmount">Importo (€)</label><input class="input" id="mAmount" type="number" min="0.01" step="0.01" required placeholder="0,00"></div><div class="field wide"><label for="mDescription">Descrizione</label><input class="input" id="mDescription" maxlength="120" required placeholder="Es. Spesa alimentare"></div><div class="field"><label for="mCategory">Categoria</label><select id="mCategory"></select></div><div class="field"><label for="mDate">Data</label><input class="input" type="date" id="mDate" required></div><div class="field wide"><label for="mNote">Nota (facoltativa)</label><textarea id="mNote" rows="2" maxlength="400" placeholder="Dettagli aggiuntivi"></textarea></div></div><div class="modal-bottom"><button class="btn secondary" type="button" data-close="movementDialog">Annulla</button><button class="btn" type="submit">Salva movimento</button></div></form></dialog>
<dialog id="deadlineDialog"><form class="modal" id="deadlineForm"><h2 id="deadlineDialogTitle">Nuova scadenza</h2><div class="fields"><div class="field wide"><label for="dTitle">Cosa devi ricordare?</label><input class="input" id="dTitle" maxlength="140" required placeholder="Es. Pagare assicurazione"></div><div class="field"><label for="dDate">Scadenza</label><input class="input" type="date" id="dDate" required></div><div class="field"><label for="dAmount">Importo facoltativo (€)</label><input class="input" type="number" min="0" step="0.01" id="dAmount" placeholder="0,00"></div><div class="field wide"><label for="dNote">Nota (facoltativa)</label><textarea id="dNote" rows="2" maxlength="400"></textarea></div></div><div class="modal-bottom"><button class="btn secondary" type="button" data-close="deadlineDialog">Annulla</button><button class="btn" type="submit">Salva scadenza</button></div></form></dialog>
<dialog id="taxDialog"><form class="modal" id="taxForm"><h2 id="taxDialogTitle">Nuova voce fiscale</h2><div class="fields">
<div class="field"><label for="tYear">Anno fiscale</label><input class="input" id="tYear" type="number" min="2000" max="2100" required></div>
<div class="field"><label for="tCountry">Paese</label><select id="tCountry"><option value="IT">Italia</option><option value="CH">Svizzera</option></select></div>
<div class="field"><label for="tCategory">Categoria</label><select id="tCategory"></select></div>
<div class="field"><label for="tSubcategory">Sottovoce</label><select id="tSubcategory"></select></div>
<div class="field wide"><label for="tTitle">Descrizione</label><input class="input" id="tTitle" maxlength="140" placeholder="Es. Saldo dichiarazione" required></div>
<div class="field"><label for="tDue">Da versare (€)</label><input class="input" id="tDue" type="number" min="0" step="0.01" placeholder="0,00"></div>
<div class="field"><label for="tPaid">Già versato (€)</label><input class="input" id="tPaid" type="number" min="0" step="0.01" placeholder="0,00"></div>
<div class="field"><label for="tStatus">Stato</label><select id="tStatus"><option value="da_verificare">Da verificare</option><option value="da_fare">Da fare</option><option value="in_corso">In corso</option><option value="completato">Completato</option></select></div>
<div class="field"><label for="tDate">Scadenza (facoltativa)</label><input class="input" id="tDate" type="date"></div>
<div class="field wide"><label for="tNote">Nota (facoltativa)</label><textarea id="tNote" rows="3" maxlength="600" placeholder="Non inserire password, IBAN o dati identificativi completi"></textarea></div>
</div><div class="modal-bottom"><button class="btn secondary" type="button" data-close="taxDialog">Annulla</button><button class="btn" type="submit">Salva voce</button></div></form></dialog>
<dialog id="taxSubDialog"><form class="modal" id="taxSubForm"><h2 id="taxSubDialogTitle">Nuova sottovoce</h2><div class="fields"><div class="field wide"><label for="subCategory">Categoria</label><select id="subCategory"></select></div><div class="field wide"><label for="subName">Nome sottovoce</label><input class="input" id="subName" maxlength="70" required placeholder="Es. Acconti IRPEF"></div></div><div class="modal-bottom"><button class="btn secondary" type="button" data-close="taxSubDialog">Annulla</button><button class="btn" type="submit">Salva sottovoce</button></div></form></dialog>
</template></body></html>
